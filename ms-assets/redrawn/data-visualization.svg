<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="640" height="360" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>

  <text x="320" y="42" font-size="18" font-weight="600" fill="#141414" text-anchor="middle">Data visualization</text>

  <!-- bar chart -->
  <line x1="64" y1="70" x2="64" y2="158" stroke="#d3d3d8" stroke-width="1.5"/>
  <line x1="64" y1="158" x2="264" y2="158" stroke="#d3d3d8" stroke-width="1.5"/>
  <rect x="86" y="120" width="30" height="38" fill="#3b5bdb"/>
  <rect x="132" y="100" width="30" height="58" fill="#3b5bdb"/>
  <rect x="178" y="80" width="30" height="78" fill="#3b5bdb"/>
  <rect x="224" y="110" width="30" height="48" fill="#3b5bdb"/>
  <text x="164" y="190" font-size="14" font-weight="600" fill="#141414" text-anchor="middle">bar</text>

  <!-- line chart -->
  <line x1="364" y1="70" x2="364" y2="158" stroke="#d3d3d8" stroke-width="1.5"/>
  <line x1="364" y1="158" x2="564" y2="158" stroke="#d3d3d8" stroke-width="1.5"/>
  <path d="M374,142 L404,116 L434,130 L464,96 L494,112 L524,88 L552,104" fill="none" stroke="#3b5bdb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="374" cy="142" r="3" fill="#3b5bdb"/>
  <circle cx="404" cy="116" r="3" fill="#3b5bdb"/>
  <circle cx="434" cy="130" r="3" fill="#3b5bdb"/>
  <circle cx="464" cy="96" r="3" fill="#3b5bdb"/>
  <circle cx="494" cy="112" r="3" fill="#3b5bdb"/>
  <circle cx="524" cy="88" r="3" fill="#3b5bdb"/>
  <circle cx="552" cy="104" r="3" fill="#3b5bdb"/>
  <text x="464" y="190" font-size="14" font-weight="600" fill="#141414" text-anchor="middle">line</text>

  <!-- scatter plot -->
  <line x1="64" y1="214" x2="64" y2="296" stroke="#d3d3d8" stroke-width="1.5"/>
  <line x1="64" y1="296" x2="264" y2="296" stroke="#d3d3d8" stroke-width="1.5"/>
  <circle cx="82" cy="282" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="98" cy="270" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="112" cy="280" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="128" cy="258" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="142" cy="268" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="158" cy="248" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="172" cy="258" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="188" cy="238" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="202" cy="248" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="218" cy="228" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="232" cy="240" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
  <circle cx="246" cy="220" r="3.5" fill="#3b5bdb" fill-opacity="0.85"/>
