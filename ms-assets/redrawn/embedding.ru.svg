  <rect x="44" y="245" width="84" height="30" rx="8" fill="#eef1fd"/>
  <text x="86" y="265" font-size="14" fill="#141414" text-anchor="middle">машина</text>
  <line x1="134" y1="260" x2="152" y2="260" stroke="#3b5bdb" stroke-width="1.5" marker-end="url(#arr)"/>
