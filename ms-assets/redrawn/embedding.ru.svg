  <line x1="256" y1="180" x2="326" y2="180" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- right panel: 2D semantic space -->
  <line x1="425" y1="60" x2="425" y2="312" stroke="#e7e7ea" stroke-width="1"/>
  <line x1="535" y1="60" x2="535" y2="312" stroke="#e7e7ea" stroke-width="1"/>
  <line x1="348" y1="125" x2="612" y2="125" stroke="#e7e7ea" stroke-width="1"/>
  <line x1="348" y1="235" x2="612" y2="235" stroke="#e7e7ea" stroke-width="1"/>
  <line x1="480" y1="60" x2="480" y2="312" stroke="#d3d3d8" stroke-width="1.5"/>
  <line x1="348" y1="180" x2="612" y2="180" stroke="#d3d3d8" stroke-width="1.5"/>
  <text x="606" y="170" font-size="12" font-style="italic" fill="#4f4f58" text-anchor="end">d1</text>
