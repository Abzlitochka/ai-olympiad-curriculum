<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="640" height="360" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b5bdb"/>
    </marker>
    <path id="dia" d="M0 -10L9 0L0 10L-9 0Z"/>
    <path id="tri" d="M0 -10L10 8L-10 8Z" stroke-linejoin="round"/>
    <path id="star" d="M0 -11L2.7 -3.6L10.5 -3.4L4.3 1.4L6.5 8.9L0 4.5L-6.5 8.9L-4.3 1.4L-10.5 -3.4L-2.7 -3.6Z" stroke-linejoin="round"/>
  </defs>

  <!-- board base + marked cells -->
  <rect x="44" y="50" width="260" height="260" fill="#ffffff" stroke="#d3d3d8" stroke-width="1.5"/>
  <rect x="44" y="50" width="52" height="52" fill="#eef1fd"/>
  <rect x="148" y="154" width="52" height="52" fill="#eaf6ef"/>
  <rect x="200" y="258" width="52" height="52" fill="#ffe8e6"/>
  <rect x="252" y="258" width="52" height="52" fill="#6741d9" fill-opacity="0.25"/>

  <!-- grid lines -->
  <g stroke="#e7e7ea" stroke-width="1.5">
    <line x1="96" y1="50" x2="96" y2="310"/><line x1="148" y1="50" x2="148" y2="310"/>
    <line x1="200" y1="50" x2="200" y2="310"/><line x1="252" y1="50" x2="252" y2="310"/>
    <line x1="44" y1="102" x2="304" y2="102"/><line x1="44" y1="154" x2="304" y2="154"/>
    <line x1="44" y1="206" x2="304" y2="206"/><line x1="44" y1="258" x2="304" y2="258"/>
  </g>

  <!-- walls -->
  <rect x="101" y="107" width="42" height="42" rx="8" fill="#d3d3d8"/>
  <rect x="205" y="107" width="42" height="42" rx="8" fill="#d3d3d8"/>
  <rect x="101" y="211" width="42" height="42" rx="8" fill="#d3d3d8"/>

  <!-- markers: agent, reward, penalty, goal -->
  <use href="#dia" transform="translate(174 180)" fill="#1a7f45"/>
  <use href="#tri" transform="translate(226 284)" fill="#c9302c"/>
  <use href="#star" transform="translate(278 284)" fill="#6741d9" stroke="#141414" stroke-width="1"/>
  <circle cx="70" cy="76" r="11" fill="#3b5bdb"/>

  <!-- legend panel -->
  <rect x="340" y="60" width="252" height="240" rx="12" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <g font-size="14" fill="#141414">
    <circle cx="368" cy="96" r="9" fill="#3b5bdb"/>
    <text x="394" y="101">агент</text>
    <use href="#star" transform="translate(368 130)" fill="#6741d9" stroke="#141414" stroke-width="1"/>
    <text x="394" y="135">цель</text>
    <use href="#dia" transform="translate(368 164)" fill="#1a7f45"/>
    <text x="394" y="169">награда +10</text>
    <use href="#tri" transform="translate(368 198)" fill="#c9302c"/>
    <text x="394" y="203">штраф −10</text>
    <rect x="359" y="223" width="18" height="18" rx="4" fill="#d3d3d8"/>
    <text x="394" y="237">стена</text>
    <g stroke="#3b5bdb" stroke-width="2" stroke-linecap="round">
      <line x1="368" y1="270" x2="368" y2="256" marker-end="url(#arr)"/>
      <line x1="368" y1="264" x2="368" y2="278" marker-end="url(#arr)"/>
      <line x1="364" y1="267" x2="378" y2="267" marker-end="url(#arr)"/>
      <line x1="372" y1="267" x2="358" y2="267" marker-end="url(#arr)"/>
    </g>
    <text x="394" y="271">ходы</text>
  </g>
</svg>
