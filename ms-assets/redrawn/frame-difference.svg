<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="720" height="300" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>

  <text x="131" y="44" text-anchor="middle" font-size="15" font-weight="500" fill="#141414">frame t</text>
  <text x="365" y="44" text-anchor="middle" font-size="15" font-weight="500" fill="#141414">frame t+1</text>
  <text x="599" y="44" text-anchor="middle" font-size="15" font-weight="500" fill="#141414">difference</text>

  <!-- frame t -->
  <rect x="36" y="60" width="190" height="180" rx="12" fill="#ffffff" stroke="#d3d3d8" stroke-width="1.5"/>
  <line x1="50" y1="212" x2="212" y2="212" stroke="#d3d3d8" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="176" y="104" width="32" height="64" rx="6" fill="#e7e7ea"/>
  <circle cx="92" cy="194" r="18" fill="#3b5bdb"/>

  <text x="248" y="158" text-anchor="middle" font-size="24" fill="#4f4f58">−</text>

  <!-- frame t+1 -->
  <rect x="270" y="60" width="190" height="180" rx="12" fill="#ffffff" stroke="#d3d3d8" stroke-width="1.5"/>
  <line x1="284" y1="212" x2="446" y2="212" stroke="#d3d3d8" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="410" y="104" width="32" height="64" rx="6" fill="#e7e7ea"/>
  <circle cx="326" cy="194" r="18" fill="none" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.45"/>
  <circle cx="380" cy="194" r="18" fill="#3b5bdb"/>

  <text x="482" y="158" text-anchor="middle" font-size="24" fill="#4f4f58">=</text>

  <!-- difference: only changed regions remain -->
  <rect x="504" y="60" width="190" height="180" rx="12" fill="#eef1fd" stroke="#d3d3d8" stroke-width="1.5"/>
  <circle cx="560" cy="194" r="18" fill="#3b5bdb" fill-opacity="0.45"/>
  <circle cx="614" cy="194" r="18" fill="#3b5bdb"/>
</svg>
