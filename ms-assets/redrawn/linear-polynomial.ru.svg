<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="640" height="360" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <!-- panel cards -->
  <rect x="40" y="64" width="264" height="252" rx="12" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <rect x="336" y="64" width="264" height="252" rx="12" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <text x="172" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#141414">линейная</text>
  <text x="468" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#141414">полиномиальная</text>
  <!-- axes -->
  <path d="M66 116V286H294M362 116V286H590" fill="none" stroke="#d3d3d8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- linear: straight fit misses curve -->
  <path d="M72 262L288 148" fill="none" stroke="#3b5bdb" stroke-width="2.5" stroke-linecap="round"/>
  <!-- polynomial: curve follows data -->
  <path d="M368 150C404 250 430 286 466 268C502 250 520 170 584 132" fill="none" stroke="#1a7f45" stroke-width="2.5" stroke-linecap="round"/>
  <!-- shared curved data -->
  <g fill="#141414">
    <circle cx="84" cy="150" r="4"/><circle cx="110" cy="196" r="4"/><circle cx="136" cy="230" r="4"/>
    <circle cx="162" cy="252" r="4"/><circle cx="188" cy="258" r="4"/><circle cx="214" cy="248" r="4"/>
    <circle cx="240" cy="226" r="4"/><circle cx="266" cy="196" r="4"/><circle cx="284" cy="170" r="4"/>
    <circle cx="380" cy="150" r="4"/><circle cx="406" cy="196" r="4"/><circle cx="432" cy="230" r="4"/>
    <circle cx="458" cy="252" r="4"/><circle cx="484" cy="258" r="4"/><circle cx="510" cy="248" r="4"/>
    <circle cx="536" cy="226" r="4"/><circle cx="562" cy="196" r="4"/><circle cx="580" cy="170" r="4"/>
  </g>
  <!-- formulas -->
  <text x="172" y="336" text-anchor="middle" font-size="14" font-style="italic" fill="#4f4f58">y = m x + b</text>
  <text x="468" y="336" text-anchor="middle" font-size="14" font-style="italic" fill="#4f4f58">y = a x² + b x + c</text>
</svg>
