  <text x="177" y="326" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">y = mx + b</text>

  <!-- right panel: logistic -->
  <text x="485" y="72" text-anchor="middle" font-size="15" font-weight="600" fill="#141414">логистическая</text>
  <path d="M360 285V95" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
