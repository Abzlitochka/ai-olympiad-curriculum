  <text x="50" y="91" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">y</text>
  <text x="288" y="304" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">x</text>
  <path d="M75 255L285 130" fill="none" stroke="#c9302c" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#3b5bdb">
