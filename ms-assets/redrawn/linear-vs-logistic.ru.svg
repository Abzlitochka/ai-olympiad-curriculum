  <text x="350" y="91" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">y</text>
  <text x="592" y="304" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">x</text>
  <path d="M360 255H598" fill="none" stroke="#d3d3d8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M360 110H598" fill="none" stroke="#d3d3d8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="350" y="259" text-anchor="end" font-size="12" fill="#4f4f58">0</text>
  <text x="350" y="114" text-anchor="end" font-size="12" fill="#4f4f58">1</text>
  <path d="M378 255C432 255 460 242 476 190C492 125 540 110 595 110" fill="none" stroke="#c9302c" stroke-width="2.5" stroke-linecap="round"/>
