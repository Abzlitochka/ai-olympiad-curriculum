<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="640" height="360" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b5bdb"/>
    </marker>
  </defs>

  <!-- source phrase bubble -->
  <rect x="48" y="112" width="36" height="22" rx="7" fill="#3b5bdb"/>
  <text x="66" y="128" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">FR</text>
  <rect x="48" y="140" width="224" height="74" rx="14" fill="#eef1fd"/>
  <path d="M272,162 L296,177 L272,192 Z" fill="#eef1fd"/>
  <text x="160" y="184" font-size="17" font-weight="600" fill="#141414" text-anchor="middle">J'aime la monnaie</text>

  <!-- branch arrows -->
  <path d="M296,168 C334,168 340,150 366,150" fill="none" stroke="#3b5bdb" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M296,186 C334,186 340,238 366,238" fill="none" stroke="#3b5bdb" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- candidate 1: correct -->
  <rect x="368" y="118" width="244" height="64" rx="12" fill="#eaf6ef"/>
  <circle cx="402" cy="150" r="13" fill="#1a7f45"/>
  <path d="M395.5,150.5 L400.5,155 L408,146" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="432" y="156" font-size="16" fill="#141414">I love money</text>

  <!-- candidate 2: wrong sense -->
  <rect x="368" y="206" width="244" height="64" rx="12" fill="#ffe8e6"/>
  <circle cx="402" cy="238" r="13" fill="#c9302c"/>
  <path d="M396.5,232.5 L407.5,243.5 M407.5,232.5 L396.5,243.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="432" y="244" font-size="16" fill="#141414">I love change</text>

  <!-- caption -->
  <text x="320" y="318" font-size="13" fill="#4f4f58" text-anchor="middle">one word, two meanings</text>
</svg>
