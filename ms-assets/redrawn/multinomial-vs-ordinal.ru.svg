<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="640" height="360" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#141414"/>
    </marker>
  </defs>

  <text x="320" y="37" text-anchor="middle" font-size="18" font-weight="600" fill="#141414">Мультиномиальная vs порядковая</text>

  <!-- left panel: multinomial — unordered classes -->
  <text x="172" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#141414">мультиномиальная</text>
  <text x="172" y="85" text-anchor="middle" font-size="12.5" fill="#4f4f58">классы без порядка</text>
  <path d="M55 300V115" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M55 300H305" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="46" y="111" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">x₂</text>
  <text x="297" y="318" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">x₁</text>
  <!-- three nominal groups: different colors, no inherent order -->
  <ellipse cx="118" cy="162" rx="48" ry="30" fill="none" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g fill="#3b5bdb">
    <circle cx="98" cy="152" r="6.5"/>
    <circle cx="122" cy="146" r="6.5"/>
    <circle cx="140" cy="160" r="6.5"/>
    <circle cx="106" cy="172" r="6.5"/>
    <circle cx="130" cy="178" r="6.5"/>
  </g>
  <text x="118" y="206" text-anchor="middle" font-size="13" fill="#4f4f58">А</text>
  <ellipse cx="246" cy="150" rx="46" ry="30" fill="none" stroke="#1a7f45" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g fill="#1a7f45">
    <circle cx="226" cy="140" r="6.5"/>
    <circle cx="250" cy="136" r="6.5"/>
    <circle cx="268" cy="150" r="6.5"/>
    <circle cx="236" cy="160" r="6.5"/>
    <circle cx="256" cy="166" r="6.5"/>
  </g>
  <text x="246" y="194" text-anchor="middle" font-size="13" fill="#4f4f58">Б</text>
  <ellipse cx="170" cy="245" rx="50" ry="30" fill="none" stroke="#c9302c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g fill="#c9302c">
    <circle cx="148" cy="237" r="6.5"/>
    <circle cx="174" cy="231" r="6.5"/>
    <circle cx="196" cy="245" r="6.5"/>
    <circle cx="158" cy="259" r="6.5"/>
    <circle cx="184" cy="259" r="6.5"/>
  </g>
  <text x="170" y="289" text-anchor="middle" font-size="13" fill="#4f4f58">В</text>

  <!-- right panel: ordinal — ordered classes -->
  <text x="482" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#141414">порядковая</text>
  <text x="482" y="85" text-anchor="middle" font-size="12.5" fill="#4f4f58">упорядоченные классы</text>
  <path d="M350 300V115" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <path d="M350 300H610" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="341" y="111" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">x₂</text>
  <text x="601" y="318" text-anchor="middle" font-size="13" font-style="italic" fill="#4f4f58">x₁</text>
  <!-- band separators -->
  <path d="M435 125V295" fill="none" stroke="#d3d3d8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M515 125V295" fill="none" stroke="#d3d3d8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- progression arrow -->
  <path d="M380 128H585" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- same class, increasing size: S < M < L -->
  <g fill="#3b5bdb">
    <circle cx="384" cy="234" r="4.5"/>
    <circle cx="398" cy="212" r="4.5"/>
    <circle cx="414" cy="242" r="4.5"/>
    <circle cx="391" cy="260" r="4.5"/>
    <circle cx="409" cy="222" r="4.5"/>
  </g>
  <g fill="#3b5bdb">
    <circle cx="458" cy="200" r="7.5"/>
    <circle cx="478" cy="178" r="7.5"/>
    <circle cx="493" cy="208" r="7.5"/>
    <circle cx="468" cy="232" r="7.5"/>
    <circle cx="487" cy="252" r="7.5"/>
  </g>
  <g fill="#3b5bdb">
    <circle cx="542" cy="148" r="11"/>
    <circle cx="567" cy="168" r="11"/>
    <circle cx="549" cy="196" r="11"/>
    <circle cx="572" cy="218" r="11"/>
    <circle cx="556" cy="244" r="11"/>
  </g>
  <text x="398" y="290" text-anchor="middle" font-size="13" fill="#4f4f58">S</text>
  <text x="478" y="290" text-anchor="middle" font-size="13" fill="#4f4f58">M</text>
  <text x="558" y="290" text-anchor="middle" font-size="13" fill="#4f4f58">L</text>
</svg>
