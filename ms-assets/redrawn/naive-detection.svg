<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="640" height="360" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <defs>
    <clipPath id="sc"><rect x="120" y="56" width="400" height="210" rx="10"/></clipPath>
  </defs>

  <!-- legend: sliding windows -->
  <rect x="458" y="26" width="22" height="15" rx="3" fill="none" stroke="#3b5bdb" stroke-width="1.5"/>
  <text x="488" y="38" font-size="13" fill="#141414">sliding windows</text>

  <!-- image scene -->
  <g clip-path="url(#sc)">
    <rect x="120" y="56" width="400" height="134" fill="#eef1fd"/>
    <rect x="120" y="190" width="400" height="76" fill="#eaf6ef"/>
    <circle cx="470" cy="94" r="16" fill="#6741d9"/>
    <path d="M250 190L340 100L430 190Z" fill="#e7e7ea" stroke-linejoin="round"/>
    <path d="M140 190L230 115L320 190Z" fill="#d3d3d8" stroke-linejoin="round"/>
    <circle cx="350" cy="232" r="17" fill="#3b5bdb"/>

    <!-- sliding windows at many positions and scales -->
    <g fill="none" stroke="#3b5bdb" stroke-width="1.5" opacity="0.75">
      <rect x="136" y="76" width="52" height="52"/>
      <rect x="196" y="96" width="60" height="60"/>
      <rect x="296" y="66" width="48" height="48"/>
      <rect x="350" y="80" width="70" height="50"/>
      <rect x="446" y="58" width="64" height="84"/>
      <rect x="120" y="110" width="44" height="92"/>
      <rect x="180" y="130" width="50" height="80"/>
      <rect x="300" y="110" width="112" height="92"/>
      <rect x="156" y="158" width="84" height="66"/>
      <rect x="256" y="148" width="66" height="66"/>
      <rect x="384" y="168" width="92" height="68"/>
      <rect x="238" y="192" width="124" height="72"/>
      <rect x="138" y="202" width="104" height="62"/>
      <rect x="416" y="192" width="96" height="72"/>
      <rect x="310" y="198" width="72" height="58"/>
    </g>
    <!-- one window localizes the object -->
    <rect x="329" y="212" width="42" height="42" fill="none" stroke="#1a7f45" stroke-width="2"/>
  </g>
  <rect x="120" y="56" width="400" height="210" rx="10" fill="none" stroke="#d3d3d8" stroke-width="1.5"/>
  <text x="320" y="296" text-anchor="middle" font-size="14" fill="#4f4f58">image</text>
</svg>
