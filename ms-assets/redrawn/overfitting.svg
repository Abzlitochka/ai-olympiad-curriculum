<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="640" height="360" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <!-- panel cards -->
  <rect x="36" y="64" width="164" height="252" rx="12" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <rect x="238" y="64" width="164" height="252" rx="12" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <rect x="440" y="64" width="164" height="252" rx="12" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <!-- panel titles -->
  <text x="118" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#c9302c">underfit</text>
  <text x="320" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#1a7f45">good fit</text>
  <text x="522" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#c9302c">overfit</text>
  <!-- axes -->
  <path d="M54 108V292H186" fill="none" stroke="#d3d3d8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M256 108V292H388" fill="none" stroke="#d3d3d8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M458 108V292H590" fill="none" stroke="#d3d3d8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- underfit: straight line misses curved data -->
  <path d="M60 232L176 240" fill="none" stroke="#c9302c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M62 204V232M118 266V236M174 206V240" fill="none" stroke="#c9302c" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
  <!-- good fit: smooth curve through data -->
  <path d="M260 200Q320 318 380 200" fill="none" stroke="#1a7f45" stroke-width="2.5" stroke-linecap="round"/>
  <!-- overfit: wiggly curve hits every point -->
  <path d="M458 184C461 192 463 198 466 204C470 214 476 236 480 232C484 236 490 258 494 247C498 244 504 272 508 262C512 258 518 276 522 266C526 262 532 250 536 260C540 262 546 238 550 247C554 252 560 220 564 230C568 234 574 196 578 206C582 216 586 220 590 226" fill="none" stroke="#c9302c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data points (same set in all panels) -->
  <g fill="#3b5bdb">
    <circle cx="62" cy="204" r="4"/><circle cx="76" cy="232" r="4"/><circle cx="90" cy="247" r="4"/><circle cx="104" cy="262" r="4"/><circle cx="118" cy="266" r="4"/><circle cx="132" cy="260" r="4"/><circle cx="146" cy="247" r="4"/><circle cx="160" cy="230" r="4"/><circle cx="174" cy="206" r="4"/>
    <circle cx="264" cy="204" r="4"/><circle cx="278" cy="232" r="4"/><circle cx="292" cy="247" r="4"/><circle cx="306" cy="262" r="4"/><circle cx="320" cy="266" r="4"/><circle cx="334" cy="260" r="4"/><circle cx="348" cy="247" r="4"/><circle cx="362" cy="230" r="4"/><circle cx="376" cy="206" r="4"/>
    <circle cx="466" cy="204" r="4"/><circle cx="480" cy="232" r="4"/><circle cx="494" cy="247" r="4"/><circle cx="508" cy="262" r="4"/><circle cx="522" cy="266" r="4"/><circle cx="536" cy="260" r="4"/><circle cx="550" cy="247" r="4"/><circle cx="564" cy="230" r="4"/><circle cx="578" cy="206" r="4"/>
  </g>
</svg>
