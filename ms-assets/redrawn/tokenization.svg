<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Onest, 'Segoe UI', system-ui, Arial, sans-serif">
  <rect width="640" height="360" rx="18" fill="#ffffff" stroke="#e7e7ea" stroke-width="1.5"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b5bdb"/>
    </marker>
  </defs>

  <!-- source sentence -->
  <text x="320" y="110" font-size="18" font-weight="600" fill="#141414" text-anchor="middle">I really like pizza!</text>
  <line x1="320" y1="132" x2="320" y2="168" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- token chips -->
  <text x="44" y="205" font-size="13" fill="#4f4f58">tokens</text>

  <rect x="141" y="182" width="44" height="36" rx="9" fill="#eef1fd"/>
  <text x="163" y="206" font-size="15" fill="#141414" text-anchor="middle">I</text>
  <rect x="197" y="182" width="80" height="36" rx="9" fill="#eef1fd"/>
  <text x="237" y="206" font-size="15" fill="#141414" text-anchor="middle">really</text>
  <rect x="289" y="182" width="66" height="36" rx="9" fill="#eef1fd"/>
  <text x="322" y="206" font-size="15" fill="#141414" text-anchor="middle">like</text>
  <rect x="367" y="182" width="78" height="36" rx="9" fill="#eef1fd"/>
  <text x="406" y="206" font-size="15" fill="#141414" text-anchor="middle">pizza</text>
  <rect x="457" y="182" width="44" height="36" rx="9" fill="#ebe6ff"/>
  <text x="479" y="206" font-size="15" fill="#141414" text-anchor="middle">!</text>

  <!-- token indices -->
  <text x="163" y="248" font-size="12" fill="#4f4f58" text-anchor="middle">1</text>
  <text x="237" y="248" font-size="12" fill="#4f4f58" text-anchor="middle">2</text>
  <text x="322" y="248" font-size="12" fill="#4f4f58" text-anchor="middle">3</text>
  <text x="406" y="248" font-size="12" fill="#4f4f58" text-anchor="middle">4</text>
  <text x="479" y="248" font-size="12" fill="#4f4f58" text-anchor="middle">5</text>
</svg>
